let tab='episodes',selected=10;const content=document.querySelector('#content');const tag=t=>`<span class="tag">${t}</span>`;function card(p){let i=people.indexOf(p);return `<button class="card" data-person="${i}"><div class="card-top"><span>${p[5]==='主线'?'⭐':'📌'} ${p[5]==='主线'?'常驻 / 主线':'单支线人物'}</span><span class="${p[4]==='反派'?'bad':p[4]==='正派'?'dot':'tbd'}">● ${p[4]}</span></div><span class="number">${p[1]}</span><h3>${p[0]}</h3><p>${p[6]}</p><small>${p[2]} · 早期登场 EP.${String(p[3]).padStart(2,'0')}</small></button>`}function head(a,b){return `<div class="section-head"><h2>${a}</h2><small>${b}</small></div>`}

if(tab==='stories'){const ss=[['01','认可自己的名字','EP.01–02 · 成长线','鸣人渴望得到认可，木叶丸希望摆脱“火影孙子”的标签。两人的相遇，让“被看见”成为故事的起点。','阶段完成'],['02','成为真正的小队','EP.03–05 · 第七班主线','从各自为战到为同伴考虑，抢铃铛测试把团队合作放在个人表现之前。','阶段完成'],['03','通往波之国的桥','EP.06–10 · 任务主线 / 仍在进行','护送造桥师傅的任务，牵出当地运输控制与雇佣忍者的冲突。截至第 10 集，危险尚未解除。','进行中'],['04','竞争，也可以是默契','EP.03–10 · 人物关系线','鸣人与佐助的较劲持续存在；在强敌面前，他们开始用配合回应危险。','进行中'],['05','英雄真的存在吗？','EP.10 · 伊那利支线的开端','伊那利质疑鸣人的英雄宣言。这里只记录分歧，不提前解释他的经历。','刚展开']];content.innerHTML=head('交织的故事线','这里的“支线”指人物叙事，并非动画原创集')+ss.map(s=>`<article class="story"><div class="label">STORY ${s[0]} / ${s[2]}</div><h3>${s[1]}</h3><p>${s[3]}</p>${tag(s[4])}</article>`).join('')} }
function filter(){const q=document.getElementById('search').value.trim().toLowerCase(),s=document.getElementById('side').value,k=document.getElementById('kind').value;let found=people.filter(p=>(!q||p.join(' ').toLowerCase().includes(q))&&(!s||p[4]===s)&&(!k||p[5]===k));document.getElementById('results').innerHTML=found.length?found.map(card).join(''):'<p class="empty">没有找到匹配的人物，请试试其他关键词。</p>'}
document.addEventListener('click',e=>{let n=e.target.closest('[data-tab]');if(n){tab=n.dataset.tab;render()}n=e.target.closest('[data-ep]');if(n){selected=+n.dataset.ep;render()}n=e.target.closest('[data-person]');if(n){let p=people[+n.dataset.person];document.getElementById('detailBody').innerHTML=`<div class="label">CHARACTER FILE / 截至 EP.10</div><h2 style="margin:20px 0">${p[0]}</h2>${tag(p[4])}${tag(p[5]==='主线'?'⭐ 常驻 / 主线':'📌 单支线人物')}<p>${p[6]}</p><p>${p[7]}</p><small>地域记录：${p[2]}<br>早期登场：EP.${p[3]}</small>`;document.getElementById('detail').showModal()}});document.querySelector('.close').onclick=()=>document.getElementById('detail').close();document.getElementById('detail').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});render();
